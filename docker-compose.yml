services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bmkg
      POSTGRES_PASSWORD: bmkg
      POSTGRES_DB: bmkgintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bmkg:bmkg@db:5432/bmkgintel
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
